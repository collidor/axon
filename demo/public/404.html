<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axon | Documentation & Showcase</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Redirects 404 paths to index.html preserving the hash
      const segmentCount = 1;
      const location = window.location;
      location.replace(
        location.protocol +
          '//' +
          location.hostname +
          (location.port ? ':' + location.port : '') +
          location.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?p=/' +
          location.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (location.search ? '&q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
          location.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Axon Documentation...</p>
  </body>
</html>
